version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: open_grc_postgres_node
    restart: always
    environment:
      POSTGRES_USER: grc_admin
      POSTGRES_PASSWORD: SuperSecurePassword2026!
      POSTGRES_DB: ethical_edge_grc_pool
    ports:
      - "5432:5432"
    volumes:
      - ./init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
      - postgres_runtime_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_admin -d ethical_edge_grc_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: open_grc_api_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://grc_admin:SuperSecurePassword2026!@db:5432/ethical_edge_grc_pool
      - JWT_SECRET=YOUR_SUPER_SECRET_COMPLIANCE_KEY_2026
      - PYTHONPATH=/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_runtime_data:
