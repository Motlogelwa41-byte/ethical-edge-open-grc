<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Edge GRC | Sovereign Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .risk-high { color: #dc2626; font-weight: bold; }
        .risk-med { color: #d97706; font-weight: bold; }
        .risk-low { color: #16a34a; font-weight: bold; }
    </style>
</head>
<body class="h-full font-sans text-slate-800">

    <!-- LOGIN GATEWAY -->
    <div id="login-gateway" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/95 backdrop-blur-md p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Sovereign Node Gateway</h2>
            <div class="grid grid-cols-2 gap-3 text-xs">
                <button onclick="window.initSession('SME Standard')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:border-blue-500">SME Standard</button>
                <button onclick="window.initSession('FinTech Pro')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:border-blue-500">FinTech Pro</button>
                <button onclick="window.initSession('Capital Premium')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:border-blue-500">Capital Premium</button>
                <button onclick="window.initSession('Pure Sandbox')" class="p-3 bg-amber-100 border-2 border-amber-200 text-amber-900 rounded-lg font-bold">Pure Sandbox</button>
            </div>
        </div>
    </div>

    <div class="flex h-screen">
        <aside class="w-64 bg-slate-900 text-white p-6">
            <h2 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h2>
            <nav class="space-y-4">
                <button onclick="window.switchTab('dashboard')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">📊 Dashboard</button>
                <button onclick="window.switchTab('compliance')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">🛡️ Compliance Matrix</button>
                <button onclick="window.switchTab('risk')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">🚩 Risk Register</button>
                <button onclick="window.switchTab('checklist')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">📝 Compliance Checklist</button>
                <button onclick="window.location.reload()" class="w-full mt-10 p-2 text-rose-400 border-t border-slate-700 hover:bg-slate-800 rounded text-sm font-bold">Logout Node</button>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 id="brand-title" class="text-3xl font-bold mb-6">GRC Command Center</h1>

            <!-- Dashboard -->
            <div id="tab-dashboard" class="grid grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500"><h3>5</h3><p>Vendors Vetted</p></div>
                <div class="bg-white p-6 rounded shadow border-l-4 border-red-500"><h3>0</h3><p>Critical Risks</p></div>
                <div class="bg-white p-6 rounded shadow border-l-4 border-green-500"><h3>61.5%</h3><p>Compliance Score</p></div>
            </div>

            <!-- Compliance -->
            <div id="tab-compliance" class="hidden">
                <div id="matrix-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <!-- Risks -->
            <div id="tab-risk" class="hidden">
                <table class="w-full bg-white rounded shadow text-left">
                    <thead class="bg-slate-800 text-white"><tr><th class="p-3">ID</th><th class="p-3">Risk</th><th class="p-3">Level</th><th class="p-3">Strategy</th></tr></thead>
                    <tbody id="risk-table-body"></tbody>
                </table>
            </div>

            <!-- Checklist -->
            <div id="tab-checklist" class="hidden">
                <div id="checklist-container" class="bg-white p-6 rounded shadow space-y-2"></div>
                <button onclick="alert('Assessment Saved!')" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded font-bold">Save Assessment</button>
            </div>
        </main>
    </div>

    <!-- Audit Modal -->
    <div id="audit-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg mb-4">Audit Gate</h3>
            <p id="modal-req" class="text-sm mb-4"></p>
            <input type="file" class="block w-full mb-4">
            <button onclick="window.runAudit()" class="w-full bg-blue-600 text-white py-2 rounded">Verify Rule Telemetry</button>
            <div id="audit-results" class="hidden mt-4 p-3 bg-gray-100 rounded text-sm"></div>
        </div>
    </div>

    <script>
        // Global State & UI Bindings
        window.activeGate = "";

        window.initSession = (name) => {
            document.getElementById('login-gateway').classList.add('hidden');
            document.getElementById('brand-title').textContent = name + " — King V Dashboard";
        };

        window.switchTab = (tab) => {
            ['dashboard', 'compliance', 'risk', 'checklist'].forEach(t => 
                document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab));
        };

        window.openAudit = (id, desc) => {
            window.activeGate = id;
            document.getElementById('modal-title').textContent = "Verify " + id;
            document.getElementById('modal-req').textContent = desc;
            document.getElementById('audit-results').classList.add('hidden');
            document.getElementById('audit-modal').classList.remove('hidden');
        };

        window.runAudit = () => {
            const res = document.getElementById('audit-results');
            res.classList.remove('hidden');
            res.innerHTML = `<strong>PASSED</strong><br>Citation: Verified per King V 2026 standards.`;
        };

        // Render Data
        document.addEventListener('DOMContentLoaded', () => {
            const m = document.getElementById('matrix-grid');
            for(let i=1; i<=13; i++) m.innerHTML += `<div class="p-4 bg-white border rounded shadow"><strong>P${i}:</strong> Governance Gate.<br><button onclick="window.openAudit('P${i}', 'Governance Gate for King V compliance.')" class="text-blue-600 font-bold text-sm">Verify Gate →</button></div>`;
            
            const rb = document.getElementById('risk-table-body');
            const risks = [
                { id: "RSK-001", title: "Climate Volatility", level: "HIGH", strategy: "Nodes" },
                { id: "RSK-002", title: "Data Leakage", level: "CRITICAL", strategy: "Encryption" }
            ];
            risks.forEach(r => rb.innerHTML += `<tr><td class="p-3">${r.id}</td><td class="p-3">${r.title}</td><td class="p-3 ${r.level === 'CRITICAL' ? 'risk-high' : 'risk-med'}">${r.level}</td><td class="p-3">${r.strategy}</td></tr>`);
            
            const ch = document.getElementById('checklist-container');
            for(let i=1; i<=13; i++) ch.innerHTML += `<div class="p-2 border-b"><input type="checkbox"> P${i}: King V Compliance</div>`;
        });
    </script>
</body>
</html>
