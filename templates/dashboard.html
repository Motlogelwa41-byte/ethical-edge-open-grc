<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge GRC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
    <!-- Login Gateway -->
    <div id="login-gateway" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/95 backdrop-blur-md p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold mb-6 text-center">Sovereign Node Gateway</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.initSession('SME Standard')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-blue-50 cursor-pointer">SME Standard</button>
                <button onclick="window.initSession('FinTech Pro')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-blue-50 cursor-pointer">FinTech Pro</button>
                <button onclick="window.initSession('Capital Premium')" class="p-3 border-2 border-slate-200 rounded-lg font-bold hover:bg-blue-50">Capital Premium</button>
                <button onclick="window.initSession('Pure Sandbox')" class="p-3 bg-amber-100 border-2 border-amber-200 text-amber-900 rounded-lg font-bold">Pure Sandbox</button>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white p-6 z-[100]">
            <h2 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h2>
            <nav class="space-y-4">
                <button onclick="window.switchTab('dashboard')" class="block w-full text-left p-3 hover:bg-slate-700 rounded cursor-pointer font-bold">📊 Dashboard</button>
                <button onclick="window.switchTab('compliance')" class="block w-full text-left p-3 hover:bg-slate-700 rounded cursor-pointer font-bold">🛡️ Compliance Matrix</button>
                <button onclick="window.switchTab('risk')" class="block w-full text-left p-3 hover:bg-slate-700 rounded cursor-pointer font-bold">🚩 Risk Register</button>
                <button onclick="window.location.reload()" class="block w-full text-left p-3 mt-10 text-rose-400 border-t border-slate-700 hover:bg-slate-800 rounded cursor-pointer font-bold">Logout Node</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto z-[90]">
            <h1 id="brand-title" class="text-3xl font-bold mb-6">GRC Command Center</h1>
            
            <div id="tab-dashboard" class="grid grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500"><h3>5</h3><p>Vendors Vetted</p></div>
                <div class="bg-white p-6 rounded shadow border-l-4 border-red-500"><h3>0</h3><p>Critical Risks</p></div>
                <div class="bg-white p-6 rounded shadow border-l-4 border-green-500"><h3>61.5%</h3><p>Compliance Score</p></div>
            </div>

            <div id="tab-compliance" class="hidden">
                <h2 class="text-2xl font-bold mb-4">🛡️ King V Compliance Matrix</h2>
                <div id="matrix-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="tab-risk" class="hidden">
                <h2 class="text-2xl font-bold mb-4">🚩 Live Risk Register</h2>
                <table class="w-full bg-white rounded shadow text-left">
                    <thead class="bg-slate-800 text-white"><tr><th class="p-3">ID</th><th class="p-3">Risk</th><th class="p-3">Strategy</th></tr></thead>
                    <tbody id="risk-table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Force functions onto the Window object so buttons can always see them
        window.initSession = (name) => {
            console.log("Initializing session for:", name);
            document.getElementById('login-gateway').classList.add('hidden');
            document.getElementById('brand-title').textContent = name + " — Command Center";
        };

        window.switchTab = (tab) => {
            console.log("Switching tab to:", tab);
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-compliance').classList.toggle('hidden', tab !== 'compliance');
            document.getElementById('tab-risk').classList.toggle('hidden', tab !== 'risk');
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Populate Matrix
            const m = document.getElementById('matrix-grid');
            for(let i=1; i<=13; i++) m.innerHTML += `<div class="p-4 bg-white border rounded shadow"><strong>P${i}:</strong> Governance Gate.<br><button onclick="alert('Audit for P${i} Passed!')" class="mt-2 text-blue-600 font-bold text-sm cursor-pointer">Verify Gate →</button></div>`;
            
            // Populate Risks
            const rb = document.getElementById('risk-table-body');
            [{id:"RSK-001", t:"Climate Volatility", s:"Diversified nodes"}, {id:"RSK-002", t:"Data Leakage", s:"Encryption"}].forEach(r => rb.innerHTML += `<tr class="border-b"><td class="p-3">${r.id}</td><td class="p-3">${r.t}</td><td class="p-3">${r.s}</td></tr>`);
        });
    </script>
</body>
</html>
