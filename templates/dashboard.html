<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge | Enterprise GRC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex flex-col">

    <!-- LOGIN GATEWAY -->
    <div id="login-gateway" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-700 rounded-xl p-8 shadow-2xl">
            <h2 class="text-white text-2xl font-bold mb-2">Sovereign Node Gateway</h2>
            <p class="text-slate-400 mb-8 text-sm">Select your organizational node to initiate the King V command loop.</p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.initSession('SME Standard')" class="p-3 bg-slate-800 text-white rounded hover:bg-blue-600 font-bold text-xs">SME Standard</button>
                <button onclick="window.initSession('FinTech Pro')" class="p-3 bg-slate-800 text-white rounded hover:bg-blue-600 font-bold text-xs">FinTech Pro</button>
                <button onclick="window.initSession('Capital Premium')" class="p-3 bg-slate-800 text-white rounded hover:bg-blue-600 font-bold text-xs">Capital Premium</button>
                <button onclick="window.initSession('Pure Sandbox')" class="p-3 bg-amber-900 text-white rounded font-bold text-xs">Pure Sandbox</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
        <span class="font-bold text-xl tracking-tighter">Ethical Edge GRC</span>
        <div class="flex items-center gap-6">
            <span id="node-badge" class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Node: Offline</span>
            <button onclick="location.reload()" class="text-sm font-semibold text-rose-400 hover:text-rose-300">Logout</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-slate-100 border-r border-slate-200 p-6 space-y-4">
            <button onclick="window.switchTab('dashboard')" class="w-full text-left font-semibold text-slate-700 hover:text-blue-600">📊 Dashboard</button>
            <button onclick="window.switchTab('compliance')" class="w-full text-left font-semibold text-slate-700 hover:text-blue-600">🛡️ Compliance Matrix</button>
            <button onclick="window.switchTab('risk')" class="w-full text-left font-semibold text-slate-700 hover:text-blue-600">🚩 Risk Register</button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 id="brand-title" class="text-3xl font-bold mb-8">GRC Command Center</h1>

            <!-- Dashboard -->
            <div id="tab-dashboard" class="grid grid-cols-3 gap-6">
                <div class="bg-white p-8 rounded-lg shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-400 uppercase">Vendors Vetted</h2>
                    <p class="text-4xl font-bold mt-2">5</p>
                </div>
                <div class="bg-white p-8 rounded-lg shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-400 uppercase">Critical Risks</h2>
                    <p class="text-4xl font-bold mt-2 text-red-600">0</p>
                </div>
                <div class="bg-white p-8 rounded-lg shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-400 uppercase">Compliance Score</h2>
                    <p class="text-4xl font-bold mt-2 text-green-600">61.5%</p>
                </div>
            </div>

            <!-- Compliance -->
            <div id="tab-compliance" class="hidden">
                <div id="matrix-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- Risks -->
            <div id="tab-risk" class="hidden">
                <table class="w-full bg-white rounded shadow-sm border border-slate-200">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-4">ID</th><th class="p-4">Risk</th><th class="p-4">Level</th><th class="p-4">Strategy</th></tr></thead>
                    <tbody id="risk-table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        window.initSession = (name) => {
            document.getElementById('login-gateway').classList.add('hidden');
            document.getElementById('brand-title').textContent = name + " — Command Center";
            document.getElementById('node-badge').textContent = "Node: " + name;
        };

        window.switchTab = (tab) => {
            ['dashboard', 'compliance', 'risk'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab));
        };

        document.addEventListener('DOMContentLoaded', () => {
            const m = document.getElementById('matrix-grid');
            for(let i=1; i<=13; i++) m.innerHTML += `<div class="bg-white p-5 border border-slate-200 rounded-lg hover:shadow-md transition-shadow">
                <div class="font-bold text-blue-600 mb-1">P${i}</div>
                <div class="text-sm font-medium mb-3">Governance Gate for King V compliance.</div>
                <button class="text-xs font-bold bg-slate-900 text-white px-3 py-1 rounded">Verify Gate</button>
            </div>`;
            
            const rb = document.getElementById('risk-table-body');
            [{id:"RSK-001", t:"Climate Volatility", l:"HIGH", s:"Nodes"}, {id:"RSK-002", t:"Data Leakage", l:"CRITICAL", s:"Encryption"}].forEach(r => rb.innerHTML += `<tr class="border-b"><td class="p-4 font-mono">${r.id}</td><td class="p-4 font-semibold">${r.t}</td><td class="p-4 ${r.l === 'CRITICAL' ? 'text-red-600' : 'text-orange-600'} font-bold">${r.l}</td><td class="p-4">${r.s}</td></tr>`);
        });
    </script>
</body>
</html>
