<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Edge GRC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
    <div class="flex h-screen bg-slate-50">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 text-white p-6 flex flex-col">
            <h2 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h2>
            <nav class="space-y-4 flex-grow">
                <button onclick="window.switchTab('dashboard')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">📊 Dashboard</button>
                <button onclick="window.switchTab('compliance')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">🛡️ Compliance Matrix</button>
                <button onclick="window.switchTab('risk')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">🚩 Risk Register</button>
            </nav>
            <button onclick="window.location.reload()" class="w-full py-2 bg-rose-600 rounded text-sm font-bold">Logout Node</button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            <div id="tab-dashboard">
                <h1 class="text-2xl font-bold mb-6">GRC Command Center</h1>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500"><h3>5</h3><p>Vendors Vetted</p></div>
                    <div class="bg-white p-6 rounded shadow border-l-4 border-red-500"><h3>0</h3><p>Critical Risks</p></div>
                    <div class="bg-white p-6 rounded shadow border-l-4 border-green-500"><h3>61.5%</h3><p>Compliance Score</p></div>
                </div>
            </div>

            <div id="tab-compliance" class="hidden">
                <h2 class="text-2xl font-bold mb-4">🛡️ King V Compliance Matrix</h2>
                <div id="checklist-container" class="bg-white p-6 rounded shadow space-y-2"></div>
                <button onclick="window.saveAssessment()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Save Assessment</button>
            </div>

            <div id="tab-risk" class="hidden">
                <h2 class="text-2xl font-bold mb-4">🚩 Live Risk Register</h2>
                <table class="w-full bg-white rounded shadow text-left">
                    <thead class="bg-slate-800 text-white">
                        <tr><th class="p-3">ID</th><th class="p-3">Risk</th><th class="p-3">Level</th><th class="p-3">Strategy</th></tr>
                    </thead>
                    <tbody id="risk-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // HARD-CODED DATA (No Server Needed)
        const principles = Array.from({length: 13}, (_, i) => ({ 
            id: `P${i + 1}`, 
            desc: "Governance Gate for King V compliance." 
        }));

        const risks = [
            { id: "RSK-001", title: "Climate Volatility", level: "HIGH", strategy: "Diversified nodes" },
            { id: "RSK-002", title: "Data Leakage", level: "CRITICAL", strategy: "AES-256 Encryption" },
            { id: "RSK-003", title: "AI Model Drift", level: "MEDIUM", strategy: "Monthly audits" },
            { id: "RSK-004", title: "Supply Chain", level: "LOW", strategy: "Multi-vendor source" },
            { id: "RSK-005", title: "Reporting Delay", level: "MEDIUM", strategy: "Automated pipelines" }
        ];

        // GLOBAL BINDINGS
        window.switchTab = (tab) => {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-compliance').classList.toggle('hidden', tab !== 'compliance');
            document.getElementById('tab-risk').classList.toggle('hidden', tab !== 'risk');
        };

        window.saveAssessment = () => alert("Compliance assessment saved locally to your device!");

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            // Render Checklist
            const container = document.getElementById('checklist-container');
            principles.forEach(p => {
                container.innerHTML += `
                    <div class="p-2 border-b flex items-center">
                        <input type="checkbox" class="mr-3 h-5 w-5">
                        <span><strong>${p.id}:</strong> ${p.desc}</span>
                    </div>
                `;
            });

            // Render Risks
            const rb = document.getElementById('risk-table-body');
            risks.forEach(r => {
                rb.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${r.id}</td>
                        <td class="p-3">${r.title}</td>
                        <td class="p-3 font-bold ${r.level === 'CRITICAL' ? 'text-red-600' : 'text-orange-500'}">${r.level}</td>
                        <td class="p-3">${r.strategy}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
