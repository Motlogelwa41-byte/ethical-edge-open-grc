<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge GRC | Enterprise Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .risk-crit { color: #b91c1c; font-weight: 800; }
        .risk-high { color: #c2410c; font-weight: 700; }
        .risk-med { color: #b45309; font-weight: 600; }
    </style>
</head>
<body class="h-full flex font-sans">

    <!-- 1. SOVEREIGN GATEWAY -->
    <div id="login-gateway" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
        <div class="max-w-md w-full bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-2xl">
            <h2 class="text-white text-2xl font-bold mb-6 text-center">Sovereign Node Gateway</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.initSession('SME Standard')" class="p-4 bg-slate-700 text-white rounded font-bold hover:bg-blue-600">SME Standard</button>
                <button onclick="window.initSession('FinTech Pro')" class="p-4 bg-slate-700 text-white rounded font-bold hover:bg-blue-600">FinTech Pro</button>
                <button onclick="window.initSession('Capital Premium')" class="p-4 bg-slate-700 text-white rounded font-bold hover:bg-blue-600">Capital Premium</button>
                <button onclick="window.initSession('Pure Sandbox')" class="p-4 bg-amber-800 text-white rounded font-bold">Pure Sandbox</button>
            </div>
        </div>
    </div>

    <!-- 2. SIDEBAR -->
    <aside class="w-64 bg-slate-950 text-slate-300 p-6 flex flex-col">
        <h1 class="text-white font-bold text-lg mb-10">Ethical Edge GRC</h1>
        <nav class="space-y-6 flex-grow">
            <button onclick="window.showTab('dashboard')" class="block w-full text-left font-semibold hover:text-white">📊 Command Center</button>
            <button onclick="window.showTab('compliance')" class="block w-full text-left font-semibold hover:text-white">🛡️ King V Matrix</button>
            <button onclick="window.showTab('risk')" class="block w-full text-left font-semibold hover:text-white">🚩 Risk Register</button>
            <button onclick="window.showTab('checklist')" class="block w-full text-left font-semibold hover:text-white">📝 Checklist</button>
        </nav>
        <button onclick="location.reload()" class="text-rose-400 font-bold">Logout Node</button>
    </aside>

    <!-- 3. MAIN WORKSPACE -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8 border-b pb-4 flex justify-between">
            <h2 id="brand-title" class="text-2xl font-bold">Dashboard</h2>
            <div id="node-badge" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold">Node: Unauthenticated</div>
        </header>

        <!-- Command Center KPIs -->
        <div id="tab-dashboard" class="grid grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded shadow border-l-4 border-blue-600"><h3>5</h3><p class="text-xs uppercase">Vendors Vetted</p></div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-red-600"><h3>0</h3><p class="text-xs uppercase">Critical Risks</p></div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-green-600"><h3>61.5%</h3><p class="text-xs uppercase">Compliance</p></div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-purple-600"><h3>66.2%</h3><p class="text-xs uppercase">Trust Index</p></div>
        </div>

        <!-- Compliance Matrix (King V Principles) -->
        <div id="tab-compliance" class="hidden space-y-8">
            <div id="matrix-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Risk Register -->
        <div id="tab-risk" class="hidden">
            <table class="w-full bg-white rounded shadow text-left">
                <thead class="bg-slate-800 text-white"><tr><th class="p-3">ID</th><th class="p-3">Risk</th><th class="p-3">Level</th><th class="p-3">Score</th><th class="p-3">Strategy</th></tr></thead>
                <tbody id="risk-body"></tbody>
            </table>
        </div>

        <!-- Checklist -->
        <div id="tab-checklist" class="hidden">
            <div id="checklist-container" class="bg-white p-6 rounded shadow space-y-2"></div>
            <button onclick="alert('Assessment Saved!')" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded">Save Assessment</button>
        </div>
    </main>

    <!-- Modal -->
    <div id="audit-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-2xl">
            <h3 id="modal-title" class="font-bold text-lg mb-2">Verify Gate</h3>
            <p id="modal-req" class="text-sm text-gray-500 mb-4"></p>
            <input type="file" class="block w-full mb-4 border p-2 text-sm">
            <button onclick="window.runAudit()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Verify Rule Telemetry</button>
            <div id="audit-results" class="hidden mt-4 p-4 bg-green-50 rounded border border-green-200 text-sm"></div>
            <button onclick="document.getElementById('audit-modal').classList.add('hidden')" class="w-full mt-2 text-xs text-gray-400">Close</button>
        </div>
    </div>

    <script>
        window.initSession = (n) => {
            document.getElementById('login-gateway').classList.add('hidden');
            document.getElementById('brand-title').textContent = n + " — Command Center";
            document.getElementById('node-badge').textContent = "Node: " + n;
        };

        window.switchTab = (t) => {
            ['dashboard', 'compliance', 'risk', 'checklist'].forEach(tab => document.getElementById('tab-' + tab).classList.toggle('hidden', tab !== t));
        };

        window.openAudit = (id, req) => {
            document.getElementById('modal-title').textContent = "Verify " + id;
            document.getElementById('modal-req').textContent = req;
            document.getElementById('audit-results').classList.add('hidden');
            document.getElementById('audit-modal').classList.remove('hidden');
        };

        window.runAudit = () => {
            const res = document.getElementById('audit-results');
            res.classList.remove('hidden');
            res.innerHTML = "<strong>PASSED:</strong> Verification successful against local regulatory schema. Compliance mapping complete.";
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Render 13 Principles
            const m = document.getElementById('matrix-container');
            for(let i=1; i<=13; i++) m.innerHTML += `<div class="p-4 bg-white rounded border shadow hover:shadow-lg"><strong>P${i}:</strong> Governance Gate.<br><button onclick="window.openAudit('P${i}', 'Confirm King V Principle ${i} compliance.')" class="mt-2 text-blue-600 font-bold text-sm">Verify Gate →</button></div>`;
            
            // Render Risks
            const rb = document.getElementById('risk-body');
            const risks = [
                { id: "RSK-001", t: "Climate Volatility", l: "HIGH", sc: "22/25", st: "Infrastructure" },
                { id: "RSK-002", t: "Data Leakage", l: "CRITICAL", sc: "24/25", st: "Encryption" },
                { id: "RSK-003", t: "AI Model Drift", l: "MEDIUM", sc: "15/25", st: "Validation" }
            ];
            risks.forEach(r => rb.innerHTML += `<tr class="border-b"><td class="p-3">${r.id}</td><td class="p-3">${r.t}</td><td class="p-3 font-bold ${r.l=='CRITICAL'?'risk-crit':'risk-med'}">${r.l}</td><td class="p-3">${r.sc}</td><td class="p-3">${r.st}</td></tr>`);
            
            // Render Checklist
            const ch = document.getElementById('checklist-container');
            for(let i=1; i<=13; i++) ch.innerHTML += `<div class="p-2 border-b"><input type="checkbox" class="mr-2"> King V Principle P${i}</div>`;
        });
    </script>
</body>
</html>
