<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge GRC — King V Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 text-white p-6">
            <h2 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h2>
            <nav class="space-y-4">
                <button onclick="window.switchTab('dashboard')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">📊 Dashboard</button>
                <button onclick="window.switchTab('compliance')" class="block w-full text-left p-2 hover:bg-slate-700 rounded">🛡️ Compliance</button>
            </nav>
        </div>

        <!-- Main -->
        <div class="flex-1 p-8 overflow-y-auto">
            <!-- Dashboard Tab -->
            <div id="tab-dashboard">
                <h1 class="text-2xl font-bold mb-6">GRC Command Center</h1>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500"><h3>5</h3><p>Vendors Vetted</p></div>
                    <div class="bg-white p-6 rounded shadow border-l-4 border-red-500"><h3>0</h3><p>Critical Risks</p></div>
                    <div class="bg-white p-6 rounded shadow border-l-4 border-green-500"><h3>61.5%</h3><p>Compliance Score</p></div>
                </div>
            </div>

            <!-- Compliance Matrix Tab -->
            <div id="tab-compliance" class="hidden">
                <h2 class="text-2xl font-bold mb-4">🛡️ King V (2026) Compliance Matrix</h2>
                <div id="matrix-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>
                <button onclick="window.saveAssessment()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Save Assessment</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="audit-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg mb-4">Verify Gate</h3>
            <p id="modal-req" class="text-sm mb-4"></p>
            <input type="file" class="block w-full mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="window.toggleModal(false)" class="px-4 py-2 bg-gray-200 rounded">Close</button>
                <button onclick="window.verifyGate()" class="px-4 py-2 bg-blue-600 text-white rounded">Verify Rule Telemetry</button>
            </div>
            <div id="modal-results" class="hidden mt-4 p-3 bg-green-50 text-green-800 rounded text-sm"></div>
        </div>
    </div>

    <script>
        window.activeGate = "";

        window.switchTab = (tab) => {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-compliance').classList.toggle('hidden', tab !== 'compliance');
        };

        window.toggleModal = (show) => document.getElementById('audit-modal').classList.toggle('hidden', !show);

        window.openVerification = (id, desc) => {
            window.activeGate = id;
            document.getElementById('modal-title').textContent = "Verify: " + id;
            document.getElementById('modal-req').textContent = desc;
            document.getElementById('audit-results').classList.add('hidden');
            window.toggleModal(true);
        };

        window.verifyGate = () => {
            const res = document.getElementById('audit-results');
            res.classList.remove('hidden');
            res.innerHTML = "<strong>PASSED</strong><br>Citation: Compliance verification mapped to King V 2026 framework.";
        };

        window.saveAssessment = () => alert("Assessment saved locally!");

        // Load 13 Principles
        const grid = document.getElementById('matrix-grid');
        for(let i=1; i<=13; i++) {
            grid.innerHTML += `
                <div class="p-4 border rounded shadow bg-white">
                    <input type="checkbox" class="mr-2"> <strong>P${i}:</strong> Governance Gate for King V compliance.<br>
                    <button onclick="window.openVerification('P${i}', 'Governance Gate for King V compliance.')" class="mt-2 text-blue-600 font-bold text-sm">Verify Gate →</button>
                </div>
            `;
        }
    </script>
</body>
</html>
