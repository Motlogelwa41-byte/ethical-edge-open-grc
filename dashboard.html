<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge GRC | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-gray-100">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 text-white p-6">
        <h1 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h1>
        <nav class="space-y-2">
            <button onclick="loadRoom('core')" class="block w-full p-3 hover:bg-slate-700 rounded">CORE GRC</button>
            <button onclick="loadRoom('gate')" class="block w-full p-3 hover:bg-slate-700 rounded">GATE FOUNDATION</button>
            <button onclick="loadRoom('gougle')" class="block w-full p-3 hover:bg-slate-700 rounded">GOUGLE</button>
            <button onclick="loadRoom('isoc')" class="block w-full p-3 hover:bg-slate-700 rounded">ISOC</button>
            <button onclick="loadRoom('safeguard')" class="block w-full p-3 hover:bg-slate-700 rounded">SAFEGUARD</button>
            <button onclick="loadRoom('unicef')" class="block w-full p-3 hover:bg-slate-700 rounded">UNICEF</button>
        </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-8">
        <h2 id="roomTitle" class="text-2xl font-bold mb-6">CORE GRC</h2>
        <div id="king-v-matrix-container" class="grid gap-6">
            <!-- Data will inject here -->
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => loadRoom('core'));

        async function loadRoom(roomKey) {
            document.getElementById('roomTitle').innerText = roomKey.toUpperCase();
            // Ensure your backend serves /api/room/{roomKey}
            const response = await fetch(`/api/room/${roomKey}`);
            const res = await response.json();
            
            if(roomKey === 'core') {
                renderGoverningFunctions(res.data.governing_functions);
            } else {
                document.getElementById('king-v-matrix-container').innerHTML = `<p>Data for ${roomKey} loaded.</p>`;
            }
        }

        function renderGoverningFunctions(data) {
            // Your existing render logic here
        }
    </script>
</body>
</html>
