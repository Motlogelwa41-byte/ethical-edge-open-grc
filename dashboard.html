<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ethical Edge GRC | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-gray-100">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 text-white p-6">
        <h1 class="text-xl font-bold mb-8 text-blue-400">Ethical Edge GRC</h1>
        <nav class="space-y-2">
            <button onclick="loadRoom('core')" class="block w-full p-3 hover:bg-slate-700 rounded">CORE GRC</button>
            <button onclick="loadRoom('gate')" class="block w-full p-3 hover:bg-slate-700 rounded">GATE FOUNDATION</button>
            <button onclick="loadRoom('gougle')" class="block w-full p-3 hover:bg-slate-700 rounded">GOUGLE</button>
            <button onclick="loadRoom('isoc')" class="block w-full p-3 hover:bg-slate-700 rounded">ISOC</button>
            <button onclick="loadRoom('safeguard')" class="block w-full p-3 hover:bg-slate-700 rounded">SAFEGUARD</button>
            <button onclick="loadRoom('unicef')" class="block w-full p-3 hover:bg-slate-700 rounded">UNICEF</button>
        </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-8">
        <h2 id="roomTitle" class="text-2xl font-bold mb-6">CORE GRC</h2>
        
        <table class="w-full bg-white rounded-lg shadow-sm">
            <thead>
                <tr class="text-left bg-gray-50 border-b">
                    <th class="p-4">Requirement</th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Action</th>
                </tr>
            </thead>
            <tbody id="king-v-matrix-container">
                <!-- Data will be injected here via JavaScript -->
            </tbody>
        </table>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => loadRoom('core'));

        async function loadRoom(roomKey) {
            document.getElementById('roomTitle').innerText = roomKey.toUpperCase();
            try {
                const response = await fetch(`/api/room/${roomKey}`);
                const res = await response.json();
                
                const container = document.getElementById('king-v-matrix-container');
                container.innerHTML = res.gates.map(gate => `
                    <tr class="border-b">
                        <td class="p-4">${gate.requirement_text}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-sm ${gate.status === 'COMPLIANT' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${gate.status}
                            </span>
                        </td>
                        <td class="p-4">
                            ${gate.status !== 'COMPLIANT' ? `<button onclick="triggerFix('${gate.gate_id}')" class="text-blue-600 hover:underline">Fix Automatically</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error loading room:", err);
            }
        }

        async function triggerFix(ref) {
            const response = await fetch(`/remediate/${ref}`, { method: 'POST' });
            if(response.ok) {
                alert("Fix applied!");
                loadRoom('core');
            } else {
                alert("Remediation failed.");
            }
        }
    </script>
</body>
</html>
