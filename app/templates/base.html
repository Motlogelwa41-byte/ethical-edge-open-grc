<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ethical Edge Cognitive GRC Engine{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-teal-500 text-gray-900 font-bold px-3 py-1 rounded text-sm tracking-wider">EE_COGNITIVE</div>
                <h1 class="text-xl font-bold text-white tracking-tight">Open GRC Engine</h1>
            </div>
            <nav class="space-x-4 text-sm font-medium text-gray-400">
                <span class="text-teal-400">Active Tenant Context:</span>
                <span class="bg-gray-900 px-2 py-1 rounded text-gray-200 font-mono text-xs border border-gray-700">{% block tenant_id %}SYSTEM_ROOT{% endblock %}</span>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 p-4 text-center text-xs text-gray-500">
        &copy; 2026 Ethical Edge GRC Consulting (Pty) Ltd. Orchestrated under SADC / BDPA Privacy Guidelines.
    </footer>

</body>
</html>
